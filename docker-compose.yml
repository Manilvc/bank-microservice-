version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bank-wallet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bank_wallet
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage (local development)
  minio:
    image: minio/minio:latest
    container_name: bank-wallet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default bucket on MinIO startup
  minio-setup:
    image: minio/mc:latest
    container_name: bank-wallet-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing minio/bank-wallet-qr-codes;
      mc anonymous set public minio/bank-wallet-qr-codes;
      exit 0;
      "

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-wallet-api
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/bank_wallet
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=bank-wallet-qr-codes
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - DEBUG=true
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
  minio_data:
